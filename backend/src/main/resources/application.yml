spring:
  application:
    name: snip-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/snip}
    username: ${SPRING_DATASOURCE_USERNAME:snip}
    password: ${SPRING_DATASOURCE_PASSWORD:snip}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 500ms
      repositories:
        enabled: false
server:
  port: 8080
  forward-headers-strategy: framework
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
app:
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:3000}
  cache-ttl: 5m
  geo-cache-ttl: 24h
  rate-limit-per-minute: 20
  cleanup-cron: "0 0 * * * *"

